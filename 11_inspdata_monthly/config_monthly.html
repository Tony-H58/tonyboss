<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>月度檢驗數據導入配置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            font-size: 1em;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 1.05em;
        }

        input[type="month"],
        input[type="text"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: Arial, sans-serif;
            transition: border-color 0.3s;
        }

        input[type="month"]:focus,
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.1);
        }

        .form-hint {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-import {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-import:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px rgba(245, 87, 108, 0.3);
        }

        .btn-preview {
            background: #4facfe;
            color: white;
        }

        .btn-preview:hover {
            background: #3a9cdb;
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
        }

        .checkbox-item input {
            width: auto;
            margin-right: 10px;
        }

        .checkbox-item label {
            margin: 0;
            font-weight: normal;
        }

        .status-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        .status-box.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-box.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status-box.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .status-box.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
            display: block;
        }

        .info-panel {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #f5576c;
        }

        .info-panel h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .info-panel ul {
            margin-left: 20px;
            color: #555;
            line-height: 1.8;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            width: 0%;
            transition: width 0.3s;
        }

        .preview-box {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            display: none;
        }

        .preview-box.active {
            display: block;
        }

        .summary-table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
            background: white;
        }

        .summary-table th,
        .summary-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .summary-table th {
            background: #f5576c;
            color: white;
            font-weight: bold;
        }

        .timestamp {
            color: #999;
            font-size: 0.9em;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 月度檢驗數據導入配置</h1>
            <p class="subtitle">每月導入檢驗記錄數據 - 月初執行一次</p>
        </div>

        <div class="form-container">
            <form id="importForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="importMonth">📅 導入月份</label>
                        <input type="month" id="importMonth" required>
                        <div class="form-hint">選擇要導入的月份</div>
                    </div>

                    <div class="form-group">
                        <label for="department">🏭 部門/生產線</label>
                        <select id="department" required>
                            <option value="">-- 請選擇 --</option>
                            <option value="all">所有部門</option>
                            <option value="lineA">A線 - 高速生產線</option>
                            <option value="lineB">B線 - 標準生產線</option>
                            <option value="lineC">C線 - 特殊規格線</option>
                            <option value="dyeing">染整部門</option>
                        </select>
                        <div class="form-hint">選擇要導入的部門或生產線</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="sourceFile">📁 源文件路徑</label>
                    <input type="text" id="sourceFile" placeholder="insprawdata_monthly/2024-11/*" readonly>
                    <div class="form-hint">自動根據月份查找源文件</div>
                </div>

                <div class="form-group">
                    <label>✓ 數據驗證規則</label>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="validateQty" checked>
                            <label for="validateQty">檢驗數量驗證</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="validateFormat" checked>
                            <label for="validateFormat">數據格式檢查</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="validateDate" checked>
                            <label for="validateDate">日期一致性檢查</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="removeDuplicate" checked>
                            <label for="removeDuplicate">移除重複記錄</label>
                        </div>
                    </div>
                    <div class="form-hint">選擇要執行的驗證規則</div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn-preview" id="previewBtn">👁️ 預覽</button>
                    <button type="submit" class="btn-import">📥 開始導入</button>
                    <button type="reset" class="btn-reset">🔄 重置</button>
                </div>

                <div id="previewBox" class="preview-box">
                    <strong>預覽結果：</strong><br><br>
                    <span id="previewContent"></span>
                </div>

                <div id="statusBox" class="status-box"></div>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="timestamp" id="timestamp"></div>
            </form>

            <div class="info-panel">
                <h3>💡 導入說明</h3>
                <ul>
                    <li><strong>導入月份：</strong>選擇要導入的月份</li>
                    <li><strong>部門選擇：</strong>可按部門分別導入或全部導入</li>
                    <li><strong>驗證規則：</strong>確保數據質量，可按需選擇</li>
                    <li><strong>預覽：</strong>點擊預覽可查看將要導入的數據摘要</li>
                    <li><strong>導入時間：</strong>根據數據量，一般需要5-15分鐘</li>
                    <li><strong>後續步驟：</strong>導入完成後，運行格式化和修復腳本</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // 設置默認月份為上個月
        const now = new Date();
        const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1);
        const monthStr = lastMonth.toISOString().slice(0, 7);
        document.getElementById('importMonth').value = monthStr;

        // 預覽功能
        document.getElementById('previewBtn').addEventListener('click', () => {
            const month = document.getElementById('importMonth').value;
            const dept = document.getElementById('department').value;

            if (!month || !dept) {
                alert('請先選擇月份和部門');
                return;
            }

            const previewBox = document.getElementById('previewBox');
            const previewContent = document.getElementById('previewContent');

            const [year, monthNum] = month.split('-');
            previewContent.innerHTML = `
                <strong>待導入數據摘要：</strong><br>
                月份: ${year}年${parseInt(monthNum)}月<br>
                部門: ${document.getElementById('department').options[document.getElementById('department').selectedIndex].text}<br>
                源文件: insprawdata_monthly/${month}/${dept}/*.xlsx<br><br>
                <strong>預期數據量：</strong><br>
                • 檢驗記錄數: ~500-1000筆<br>
                • 檢驗批次: ~50-80批<br>
                • 瑕疵類型: ~15-30種<br><br>
                <strong>驗證規則：</strong><br>
                ${document.getElementById('validateQty').checked ? '✓ 檢驗數量驗證<br>' : ''}
                ${document.getElementById('validateFormat').checked ? '✓ 數據格式檢查<br>' : ''}
                ${document.getElementById('validateDate').checked ? '✓ 日期一致性檢查<br>' : ''}
                ${document.getElementById('removeDuplicate').checked ? '✓ 移除重複記錄<br>' : ''}
            `;
            previewBox.classList.add('active');
        });

        // 表單提交
        document.getElementById('importForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const month = document.getElementById('importMonth').value;
            const dept = document.getElementById('department').value;

            if (!month || !dept) {
                alert('請填寫所有必填項');
                return;
            }

            const statusBox = document.getElementById('statusBox');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const btn = e.target.querySelector('.btn-import');
            const previewBox = document.getElementById('previewBox');

            btn.disabled = true;
            btn.textContent = '⏳ 導入中...';
            progressBar.classList.add('active');
            progressFill.style.width = '0%';
            previewBox.classList.remove('active');

            statusBox.textContent = `📥 開始導入${month}的檢驗數據...`;
            statusBox.className = 'status-box info';

            try {
                // 模擬導入進度
                const steps = [
                    { progress: 20, msg: '✓ 讀取源文件中...' },
                    { progress: 40, msg: '✓ 驗證數據中...' },
                    { progress: 60, msg: '✓ 格式轉換中...' },
                    { progress: 80, msg: '✓ 寫入數據庫中...' },
                    { progress: 100, msg: '✓ 導入完成！' }
                ];

                for (let step of steps) {
                    progressFill.style.width = step.progress + '%';
                    statusBox.textContent = step.msg;
                    await new Promise(resolve => setTimeout(resolve, 400));
                }

                statusBox.innerHTML = `
                    ✅ <strong>導入成功！</strong><br>
                    月份: ${month}<br>
                    部門: ${document.getElementById('department').options[document.getElementById('department').selectedIndex].text}<br>
                    導入記錄數: 750筆<br>
                    驗證通過率: 99.8%<br>
                    <br>下一步: 運行格式化和修復腳本
                `;
                statusBox.className = 'status-box success';

                document.getElementById('timestamp').textContent =
                    `✓ 完成時間: ${new Date().toLocaleString('zh-TW')}`;

            } catch (error) {
                statusBox.textContent = `❌ 導入失敗: ${error.message}`;
                statusBox.className = 'status-box error';
            } finally {
                btn.disabled = false;
                btn.textContent = '📥 開始導入';
                progressBar.classList.remove('active');
            }
        });

        document.getElementById('importForm').addEventListener('reset', () => {
            document.getElementById('statusBox').className = 'status-box';
            document.getElementById('progressBar').classList.remove('active');
            document.getElementById('previewBox').classList.remove('active');
            document.getElementById('timestamp').textContent = '';
        });
    </script>
</body>
</html>
