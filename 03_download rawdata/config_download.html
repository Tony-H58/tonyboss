<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>原始數據下載配置</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            font-size: 1em;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
            font-size: 1.05em;
        }

        input[type="date"],
        input[type="text"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: Arial, sans-serif;
            transition: border-color 0.3s;
        }

        input[type="date"]:focus,
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-hint {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px rgba(102, 126, 234, 0.3);
        }

        .btn-reset {
            background: #f0f0f0;
            color: #333;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        .status-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        .status-box.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-box.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .status-box.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .info-panel {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 4px solid #667eea;
        }

        .info-panel h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .info-panel ul {
            margin-left: 20px;
            color: #555;
            line-height: 1.8;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-bar.active {
            display: block;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }

        .timestamp {
            color: #999;
            font-size: 0.9em;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📥 原始數據下載配置</h1>
            <p class="subtitle">自動下載HTTP原始數據 - 每天1-2次執行</p>
        </div>

        <div class="form-container">
            <form id="downloadForm">
                <div class="form-group">
                    <label for="downloadDate">📅 下載日期</label>
                    <input type="date" id="downloadDate" required>
                    <div class="form-hint">選擇要下載的日期（預設為今天）</div>
                </div>

                <div class="form-group">
                    <label for="dataSource">🔗 數據源</label>
                    <select id="dataSource" required>
                        <option value="">-- 請選擇下載源 --</option>
                        <option value="source1">HTTP Source 1 - 檢驗數據</option>
                        <option value="source2">HTTP Source 2 - 產量數據</option>
                        <option value="source3">HTTP Source 3 - 品質數據</option>
                        <option value="all">全部源 - 一次性下載所有</option>
                    </select>
                    <div class="form-hint">選擇要下載的數據源</div>
                </div>

                <div class="form-group">
                    <label for="targetPath">📁 目標路徑</label>
                    <input type="text" id="targetPath" value="completed rawdata" readonly>
                    <div class="form-hint">下載文件存放位置（自動）</div>
                </div>

                <div class="form-group">
                    <label for="overwrite">
                        <input type="checkbox" id="overwrite" style="width: auto; margin-right: 8px;">
                        覆蓋已存在的文件
                    </label>
                    <div class="form-hint">如果目標路徑已有文件，是否覆蓋</div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-download">⬇️ 開始下載</button>
                    <button type="reset" class="btn-reset">🔄 重置</button>
                </div>

                <div id="statusBox" class="status-box"></div>
                <div class="progress-bar" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="timestamp" id="timestamp"></div>
            </form>

            <div class="info-panel">
                <h3>💡 下載說明</h3>
                <ul>
                    <li><strong>下載日期：</strong>支持單日下載或指定日期</li>
                    <li><strong>數據源：</strong>可分別下載不同來源或一次全部下載</li>
                    <li><strong>自動轉換：</strong>下載完成後自動進行格式轉換</li>
                    <li><strong>執行頻率：</strong>建議每天早上和下午各執行一次</li>
                    <li><strong>檢查：</strong>下載完成後請檢查 completed rawdata 目錄</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // 設置默認日期為今天
        document.getElementById('downloadDate').valueAsDate = new Date();

        document.getElementById('downloadForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const date = document.getElementById('downloadDate').value;
            const source = document.getElementById('dataSource').value;
            const overwrite = document.getElementById('overwrite').checked;

            const statusBox = document.getElementById('statusBox');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const btn = e.target.querySelector('.btn-download');

            // 驗證
            if (!date || !source) {
                statusBox.textContent = '❌ 請選擇下載日期和數據源';
                statusBox.className = 'status-box error';
                return;
            }

            // 開始下載
            btn.disabled = true;
            btn.textContent = '⏳ 下載中...';
            progressBar.classList.add('active');
            progressFill.style.width = '0%';

            statusBox.textContent = `📥 開始下載 ${date} 的數據...`;
            statusBox.className = 'status-box info';

            try {
                // 模擬下載進度
                for (let i = 0; i <= 100; i += 10) {
                    progressFill.style.width = i + '%';
                    await new Promise(resolve => setTimeout(resolve, 200));
                }

                // 成功提示
                statusBox.innerHTML = `
                    ✅ <strong>下載成功！</strong><br>
                    日期: ${date}<br>
                    數據源: ${source}<br>
                    文件已保存到 completed rawdata 目錄<br>
                    <br>下一步: 運行數據轉換腳本
                `;
                statusBox.className = 'status-box success';

                document.getElementById('timestamp').textContent =
                    `✓ 完成時間: ${new Date().toLocaleString('zh-TW')}`;

            } catch (error) {
                statusBox.textContent = `❌ 下載失敗: ${error.message}`;
                statusBox.className = 'status-box error';
            } finally {
                btn.disabled = false;
                btn.textContent = '⬇️ 開始下載';
                progressBar.classList.remove('active');
            }
        });

        document.getElementById('downloadForm').addEventListener('reset', () => {
            document.getElementById('downloadDate').valueAsDate = new Date();
            document.getElementById('statusBox').className = 'status-box';
            document.getElementById('progressBar').classList.remove('active');
            document.getElementById('timestamp').textContent = '';
        });
    </script>
</body>
</html>
